name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug + release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/pixel-launcher-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/pixel-launcher-v1.0.${{ github.run_number }}-debug.apk"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pixel-launcher-apk
          path: dist/*.apk
          if-no-files-found: error

      # Every build on the default/feature branch refreshes a single "latest"
      # release, so the APK always has a stable download link.
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pixel Launcher (latest build)
          body: |
            Automatic build from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            **Install `pixel-launcher-v1.0.${{ github.run_number }}.apk`**, then press
            HOME and pick Pixel Launcher (or use Settings > Set as default launcher
            inside the app).
          files: dist/*.apk
          prerelease: false
          make_latest: true
