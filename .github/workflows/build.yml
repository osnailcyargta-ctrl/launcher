name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build launcher + icon pack
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease \
            :iconpack:assembleRelease --no-daemon 2>&1 | tee build.log

      # Gradle buries compile errors under a few hundred lines of stack trace;
      # this repeats just the diagnostics at the end of the job log.
      - name: Compile errors
        if: failure()
        run: |
          echo "=== compile diagnostics ==="
          grep -E "^(e|w): |^FAILURE|^\* What went wrong" build.log | head -80 || true
          echo "=== end ==="

      - name: Rename artifacts
        run: |
          mkdir -p dist debug
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/pixel-launcher-v1.0.${{ github.run_number }}.apk"
          cp iconpack/build/outputs/apk/release/iconpack-release.apk \
             "dist/pixel-icon-pack-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "debug/pixel-launcher-v1.0.${{ github.run_number }}-debug.apk"
          ls -lh dist debug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pixel-launcher-apk
          path: |
            dist/*.apk
            debug/*.apk
          if-no-files-found: error

      # The rolling release keeps exactly one APK, so the page never fills up
      # with stale builds that someone might install by mistake.
      - name: Clear previous release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null \
            | while read -r name; do
                [ -n "$name" ] && gh release delete-asset latest "$name" -y || true
              done

      # Every build on the default/feature branch refreshes a single "latest"
      # release, so the APK always has a stable download link.
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pixel Launcher (latest build)
          body: |
            Automatic build from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            **`pixel-launcher-v1.0.${{ github.run_number }}.apk`** - the launcher.
            Install it, press HOME and pick Pixel Launcher (or use
            Settings > Set as default launcher inside the app).

            **`pixel-icon-pack-v1.0.${{ github.run_number }}.apk`** - optional.
            46 hand-drawn pixel icons as a standalone ADW/Nova icon pack. Install
            it, then choose it in Settings > Icons > Icon artwork > ICON PACK.
            It also works in Nova, Lawnchair, Apex and ADW.

            Minified release build, signed with the project key, zero permissions.
            The debug build is not published here - it is available as a workflow
            artifact when a debuggable APK is actually needed.
          files: dist/*.apk
          prerelease: false
          make_latest: true
